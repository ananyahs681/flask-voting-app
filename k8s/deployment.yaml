apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-voting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-voting
  template:
    metadata:
      labels:
        app: flask-voting
    spec:
      containers:
        - name: flask-voting
          image: flask-voting-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
